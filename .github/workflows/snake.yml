name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Every 24 hours
  workflow_dispatch:        # Manual trigger
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: Juammpa
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238b5cf6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%238b5cf6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
